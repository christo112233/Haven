<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Haven</title>
  <link rel="icon" href="/assets/logo.ico?token=__HAVEN_TOKEN__">
  <link rel="stylesheet" href="/style.css?token=__HAVEN_TOKEN__">
  <script>window.HAVEN_TOKEN = '__HAVEN_TOKEN__';</script>
  <script defer src="/assets/lucide.min.js?token=__HAVEN_TOKEN__"></script>
  <script defer src="/liquid-glass.js?token=__HAVEN_TOKEN__"></script>
  <script defer src="/app.js?token=__HAVEN_TOKEN__"></script>
</head>
<body>
  <div id="wallpaper" aria-hidden="true"></div>
  <canvas id="liquid-canvas" class="liquid-canvas" aria-hidden="true"></canvas>
  <div id="glass-cursor" aria-hidden="true"></div>
  <aside id="sidebar">
    <div class="brand pywebview-drag-region"><i data-lucide="aperture"></i><span>Haven<span class="brand-dot">.</span></span></div>
    <div class="sidebar-heading"><span>文件夹</span><button id="add-folder" class="icon-button glass" title="添加文件夹" aria-label="添加文件夹"><i data-lucide="folder-plus"></i></button></div>
    <nav id="tree" aria-label="照片目录"></nav>
    <section class="smart-albums" aria-label="智能相册"><div class="sidebar-heading"><span>智能相册</span><button id="add-smart-album" class="icon-button" title="新建智能相册" aria-label="新建智能相册"><i data-lucide="plus"></i></button></div><nav id="smart-albums-list"></nav></section>
    <div class="sidebar-bottom"><span class="local-indicator"></span><span>本地图库</span><button id="settings-button" class="icon-button" title="设置" aria-label="设置"><i data-lucide="settings-2"></i></button></div>
  </aside>
  <main>
    <header class="toolbar glass pywebview-drag-region">
      <button id="up-folder" class="icon-button" title="上一级" aria-label="上一级"><i data-lucide="arrow-up"></i></button>
      <div id="breadcrumbs" class="breadcrumbs glass">图库</div>
      <div class="search"><i data-lucide="search"></i><input id="search" type="search" placeholder="搜索文件名" aria-label="搜索文件名"></div>
      <button id="theme-button" class="icon-button" title="切换主题" aria-label="切换主题"><i data-lucide="sun"></i></button>
      <button id="refresh" class="icon-button" title="重新扫描" aria-label="重新扫描"><i data-lucide="refresh-cw"></i></button>
      <div id="window-controls" class="window-controls" hidden><button class="icon-button" data-window-action="minimize" title="最小化" aria-label="最小化"><i data-lucide="minus"></i></button><button class="icon-button" data-window-action="maximize" title="最大化或还原" aria-label="最大化或还原"><i data-lucide="square"></i></button><button class="icon-button window-close" data-window-action="close" title="关闭窗口" aria-label="关闭窗口"><i data-lucide="x"></i></button></div>
    </header>
    <section class="view-heading">
      <div class="pywebview-drag-region"><div id="folder-parent" class="eyebrow">照片与视频</div><h1 id="folder-title">Haven</h1><div id="folder-summary" class="summary">尚未添加文件夹</div></div>
      <div class="view-controls">
        <label class="recursive"><input id="recursive" type="checkbox">包含子文件夹</label>
        <div class="size-control glass"><i data-lucide="grid-2x2"></i><input id="thumb-size" aria-label="缩略图大小" type="range" min="120" max="480" value="240" step="10"><i data-lucide="layout-grid"></i></div>
      </div>
    </section>
    <section class="filterbar">
      <div id="filters" class="segments glass" role="tablist" aria-label="文件类型">
        <button role="tab" data-kind="all" aria-selected="true">全部</button><button role="tab" data-kind="image" aria-selected="false">照片</button><button role="tab" data-kind="video" aria-selected="false">视频</button><button role="tab" data-kind="raw" aria-selected="false">RAW</button><button role="tab" data-kind="heic" aria-selected="false">HEIC</button>
      </div>
      <div class="sort-controls"><button id="selection-mode" class="icon-button" title="选择照片" aria-label="选择照片" aria-pressed="false"><i data-lucide="list-checks"></i></button><button id="metadata-filter-button" class="icon-button" title="筛选" aria-label="筛选"><i data-lucide="list-filter"></i></button><select id="sort" aria-label="排序"><option value="name">文件名</option><option value="date">拍摄时间</option><option value="mtime">修改时间</option><option value="size">文件大小</option><option value="ext">文件类型</option></select><button id="sort-direction" class="icon-button" title="切换升降序" aria-label="切换升降序"><i data-lucide="arrow-down-wide-narrow"></i></button><span id="selection-mode-status" class="selection-mode-status" hidden>选择模式</span></div>
    </section>
    <div id="warning" role="status" hidden></div>
    <nav id="subfolders" class="subfolders" aria-label="子文件夹" hidden><span id="subfolders-heading" class="subfolders-heading"></span><div id="subfolders-list" class="subfolders-list"></div><button id="subfolders-toggle" class="subfolders-toggle" type="button" aria-expanded="false" hidden><span></span><i data-lucide="chevron-down"></i></button></nav>
    <div id="viewport">
      <div id="empty" class="empty-state"><i data-lucide="images"></i><h2>打开你的照片文件夹</h2><button id="empty-add" class="primary glass"><i data-lucide="folder-plus"></i>添加文件夹</button></div>
      <div id="grid" role="list" aria-label="照片与视频"></div>
    </div>
    <footer><span id="status">0 个项目</span><div id="scan-progress" hidden><progress max="100" value="0"></progress><span></span></div><span id="cache-status"><span class="local-indicator"></span>缓存 · 照片目录内</span><button id="resize-grip" class="resize-grip" title="拖动调整窗口大小" aria-label="拖动调整窗口大小" hidden><i data-lucide="grip"></i></button></footer>
  </main>
  <div id="metadata-filter" class="glass metadata-popover" hidden><div class="popover-heading"><strong>照片筛选</strong><button id="metadata-filter-close" class="icon-button" title="关闭" aria-label="关闭"><i data-lucide="x"></i></button></div><label>标签<input id="filter-tags" placeholder="多个标签用逗号分隔"></label><div class="filter-line"><label>评分<div class="select-shell"><select id="filter-rating-op"><option value="=">等于</option><option value=">=">至少</option><option value="<=">至多</option></select></div></label><div class="select-shell"><select id="filter-rating"><option value="">不限</option><option value="unrated">未评分</option><option value="1">1 星</option><option value="2">2 星</option><option value="3">3 星</option><option value="4">4 星</option><option value="5">5 星</option></select></div></div><label>颜色<div class="select-shell"><select id="filter-color"><option value="">不限</option><option value="red">红色</option><option value="yellow">黄色</option><option value="green">绿色</option><option value="blue">蓝色</option><option value="purple">紫色</option></select></div></label><div class="filter-checks"><label><input id="filter-favorite" type="checkbox">收藏</label><label><input id="filter-flagged" type="checkbox">旗帜</label><label><input id="filter-rejected" type="checkbox">Rejected</label></div><div class="dialog-actions"><button id="filter-clear" class="secondary">清除</button><button id="filter-apply" class="primary glass">应用筛选</button></div></div>
  <div id="bulk-toolbar" class="glass bulk-toolbar" hidden><span id="selection-count">已选择 0 项</span><button data-bulk="tag-add" class="icon-button" title="添加标签" aria-label="添加标签"><i data-lucide="tag"></i></button><button data-bulk="rating" class="icon-button" title="设置评分" aria-label="设置评分"><i data-lucide="star"></i></button><button data-bulk="favorite" class="icon-button" title="收藏" aria-label="收藏"><i data-lucide="heart"></i></button><button data-bulk="flagged" class="icon-button" title="旗帜" aria-label="旗帜"><i data-lucide="flag"></i></button><button data-bulk="rejected" class="icon-button" title="Rejected" aria-label="Rejected"><i data-lucide="circle-x"></i></button><button data-bulk="color" class="icon-button" title="颜色标签" aria-label="颜色标签"><i data-lucide="palette"></i></button><button id="clear-selection" class="secondary">取消选择</button></div>
  <dialog id="viewer">
    <div class="viewer-header"><div><strong id="viewer-name"></strong><span id="viewer-count"></span></div><div><button id="info-button" class="icon-button glass" title="文件详情" aria-label="文件详情"><i data-lucide="info"></i></button><button id="viewer-close" class="icon-button glass" title="关闭" aria-label="关闭"><i data-lucide="x"></i></button></div></div>
    <div id="viewer-stage" tabindex="-1"><img id="viewer-image" alt="" draggable="false"><video id="viewer-video" controls playsinline hidden></video><div id="unsupported" hidden><i data-lucide="film"></i><h2>格式不支持预览</h2><button id="system-open" class="primary glass"><i data-lucide="external-link"></i>用系统播放器打开</button></div><div id="viewer-loading" hidden>正在加载…</div></div>
    <aside id="details" hidden></aside>
    <div class="viewer-tools glass"><button id="previous" class="icon-button" title="上一张" aria-label="上一张"><i data-lucide="chevron-left"></i></button><button id="next" class="icon-button" title="下一张" aria-label="下一张"><i data-lucide="chevron-right"></i></button><span class="separator"></span><button id="rotate" class="icon-button" title="旋转预览" aria-label="旋转预览"><i data-lucide="rotate-cw"></i></button><button id="fit" class="icon-button" title="适应窗口" aria-label="适应窗口"><i data-lucide="maximize"></i></button><button id="actual" class="icon-button" title="原始大小" aria-label="原始大小"><i data-lucide="scan"></i></button><span id="zoom-label">100%</span><span class="separator"></span><button id="viewer-rating" class="icon-button" title="设置评分" aria-label="设置评分"><i data-lucide="star"></i></button><span id="viewer-rating-value" class="viewer-rating-value" aria-label="当前评分">未评分</span><button id="viewer-favorite" class="icon-button" title="收藏" aria-label="收藏" aria-pressed="false"><i data-lucide="heart"></i></button><button id="viewer-flagged" class="icon-button" title="旗帜" aria-label="旗帜" aria-pressed="false"><i data-lucide="flag"></i></button><button id="viewer-rejected" class="icon-button" title="标记 Rejected" aria-label="标记 Rejected" aria-pressed="false"><i data-lucide="circle-x"></i></button><button id="viewer-tag" class="icon-button" title="管理标签" aria-label="管理标签"><i data-lucide="tag"></i></button><button id="viewer-color" class="icon-button" title="颜色标签" aria-label="颜色标签"><i data-lucide="palette"></i></button><span class="separator"></span><button id="live-play" class="icon-button" title="播放 Live Photo" aria-label="播放 Live Photo" hidden><i data-lucide="circle-play"></i></button><button id="reveal" class="icon-button" title="在资源管理器中显示" aria-label="在资源管理器中显示"><i data-lucide="folder-open"></i></button><button id="copy-path" class="icon-button" title="复制路径" aria-label="复制路径"><i data-lucide="copy"></i></button><button id="trash" class="icon-button danger" title="移到回收站" aria-label="移到回收站"><i data-lucide="trash-2"></i></button></div>
  </dialog>
  <dialog id="settings-dialog" class="panel-dialog"><div class="dialog-heading"><h2>设置</h2><button class="icon-button" data-close="settings-dialog" title="关闭" aria-label="关闭"><i data-lucide="x"></i></button></div><div class="settings-row"><span>外观</span><div class="select-shell glass"><select id="theme-select" aria-label="外观"><option value="dark">深色</option><option value="light">浅色</option></select></div></div><div class="settings-row"><span>自动检查更新</span><input id="auto-update" type="checkbox" role="switch" aria-label="自动检查更新"></div><div class="settings-row"><span>当前版本</span><span id="version"></span></div><div class="dialog-actions"><button id="history" class="secondary"><i data-lucide="external-link"></i>更新历史</button><button id="check-update" class="primary glass"><i data-lucide="refresh-cw"></i>检查更新</button></div><p id="update-check-status" role="status"></p></dialog>
  <dialog id="update-dialog" class="panel-dialog"><div class="dialog-heading"><h2>Haven 更新</h2></div><p id="update-version"></p><p id="update-notes"></p><p id="update-size"></p><p>更新将关闭并重启 Haven，请先保存其他工作。</p><progress id="download-progress" max="100" value="0" hidden></progress><p id="download-status" role="status"></p><div class="dialog-actions"><button id="skip-update" class="secondary">跳过此版本</button><button id="later-update" class="secondary">稍后提醒</button><button id="install-update" class="primary glass"><i data-lucide="download"></i>立即更新</button></div></dialog>
  <dialog id="path-dialog" class="panel-dialog"><div class="dialog-heading"><h2>添加文件夹</h2><button class="icon-button" data-close="path-dialog" title="关闭" aria-label="关闭"><i data-lucide="x"></i></button></div><form id="path-form"><input id="folder-path" placeholder="D:\Photos" aria-label="本地文件夹路径" required><div class="dialog-actions"><button type="submit" class="primary glass"><i data-lucide="folder-plus"></i>打开文件夹</button></div></form></dialog>
  <dialog id="confirm-dialog" class="panel-dialog"><h2 id="confirm-title"></h2><p id="confirm-description"></p><div class="dialog-actions"><button id="confirm-cancel" class="secondary">取消</button><button id="confirm-ok" class="primary danger">确认</button></div></dialog>
  <dialog id="rename-dialog" class="panel-dialog"><div class="dialog-heading"><h2 id="rename-title">重命名</h2><button id="rename-close" class="icon-button" title="关闭" aria-label="关闭"><i data-lucide="x"></i></button></div><form id="rename-form"><input id="rename-name" aria-label="新名称" autocomplete="off" spellcheck="false" required><div class="dialog-actions"><button id="rename-cancel" type="button" class="secondary">取消</button><button type="submit" class="primary glass"><i data-lucide="check"></i>保存</button></div></form></dialog>
  <dialog id="tag-dialog" class="panel-dialog"><div class="dialog-heading"><h2 id="tag-dialog-title">管理标签</h2><button id="tag-dialog-close" class="icon-button" title="关闭" aria-label="关闭"><i data-lucide="x"></i></button></div><div id="tag-current" class="tag-current" aria-live="polite"></div><form id="tag-form"><input id="tag-input" list="tag-suggestions" placeholder="输入新标签，多个标签用逗号分隔" aria-label="标签"><datalist id="tag-suggestions"></datalist><div class="dialog-actions"><button id="tag-cancel" type="button" class="secondary">取消</button><button type="submit" class="primary glass">保存</button></div></form></dialog>
  <dialog id="rating-dialog" class="panel-dialog rating-dialog"><div class="dialog-heading"><h2>设置评分</h2><button id="rating-dialog-close" class="icon-button" title="关闭" aria-label="关闭"><i data-lucide="x"></i></button></div><p id="rating-summary">为选中的照片设置评分</p><div id="rating-choices" class="rating-choices"><button type="button" data-rating="1" aria-label="1 星">★</button><button type="button" data-rating="2" aria-label="2 星">★</button><button type="button" data-rating="3" aria-label="3 星">★</button><button type="button" data-rating="4" aria-label="4 星">★</button><button type="button" data-rating="5" aria-label="5 星">★</button></div><div class="dialog-actions"><button id="rating-clear" class="secondary">清除评分</button><button id="rating-cancel" class="secondary">取消</button></div></dialog>
  <dialog id="color-dialog" class="panel-dialog color-dialog"><div class="dialog-heading"><h2>颜色标签</h2><button id="color-dialog-close" class="icon-button" title="关闭" aria-label="关闭"><i data-lucide="x"></i></button></div><p>选择一个颜色作为照片标签</p><div id="color-choices" class="color-choices"><button type="button" data-color="red" aria-label="红色"><span class="color-swatch red"></span><span>红色</span></button><button type="button" data-color="yellow" aria-label="黄色"><span class="color-swatch yellow"></span><span>黄色</span></button><button type="button" data-color="green" aria-label="绿色"><span class="color-swatch green"></span><span>绿色</span></button><button type="button" data-color="blue" aria-label="蓝色"><span class="color-swatch blue"></span><span>蓝色</span></button><button type="button" data-color="purple" aria-label="紫色"><span class="color-swatch purple"></span><span>紫色</span></button></div><div class="dialog-actions"><button id="color-clear" class="secondary">清除颜色</button><button id="color-cancel" class="secondary">取消</button></div></dialog>
  <dialog id="smart-album-dialog" class="panel-dialog"><div class="dialog-heading"><h2>新建智能相册</h2><button class="icon-button" data-close="smart-album-dialog" title="关闭" aria-label="关闭"><i data-lucide="x"></i></button></div><form id="smart-album-form" novalidate><input id="smart-album-name" placeholder="相册名称" aria-label="相册名称"><div class="settings-row"><span>逻辑</span><select id="smart-album-logic"><option value="and">同时满足（AND）</option><option value="or">满足任一（OR）</option></select></div><div id="smart-album-conditions"><div class="smart-condition"><select data-field><option value="rating">评分</option><option value="tags">标签</option><option value="color_label">颜色标签</option><option value="favorite">收藏</option><option value="flagged">旗帜</option><option value="rejected">Rejected</option></select><select data-operator><option value=">=">至少</option><option value="=">等于</option><option value="contains">包含</option></select><input data-value placeholder="值"></div></div><button type="button" id="add-smart-condition" class="secondary">添加条件</button><div class="dialog-actions"><button type="button" class="secondary" data-close="smart-album-dialog">取消</button><button type="submit" class="primary glass">保存</button></div></form></dialog>
  <div id="context-menu" class="glass" hidden></div>
  <div id="toast" role="status" hidden></div>
</body>
</html>
