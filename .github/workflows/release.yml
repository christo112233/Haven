name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          architecture: x64
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: ./scripts/build.ps1
        shell: pwsh
      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: python scripts/release_manifest.py '${{ github.ref_name }}'
      - uses: actions/upload-artifact@v4
        with:
          name: Haven-win64
          path: dist/Haven-win64.zip

  macos:
    name: macOS arm64
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest discover -s tests -v
      - name: Build Haven.app, release zip and installer dmg
        env:
          PYTHON: python
        run: ./scripts/build_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Haven-mac-arm64
          path: |
            dist/Haven-mac-arm64.zip
            dist/Haven-mac-arm64.dmg

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@v4
        with:
          name: Haven-win64
          path: dist/win
      - uses: actions/download-artifact@v4
        with:
          name: Haven-mac-arm64
          path: dist/mac
      - name: Collect artifacts and write combined manifest
        run: |
          mkdir -p dist
          cp dist/win/*.zip dist/
          cp dist/mac/*.zip dist/
          cp dist/mac/*.dmg dist/
          python scripts/release_manifest.py '${{ github.ref_name }}'
          cat dist/update.json
      - uses: actions/upload-artifact@v4
        with:
          name: Haven-release
          path: |
            dist/Haven-win64.zip
            dist/Haven-mac-arm64.zip
            dist/Haven-mac-arm64.dmg
            dist/update.json
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: false
          make_latest: true
          files: |
            dist/Haven-win64.zip
            dist/Haven-mac-arm64.zip
            dist/Haven-mac-arm64.dmg
            dist/update.json
